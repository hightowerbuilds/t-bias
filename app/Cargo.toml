[package]
name = "t-bias"
version = "0.1.0"
edition = "2021"
description = "t-bias — a native GPU-accelerated terminal (GPUI + alacritty_terminal)"

[[bin]]
name = "t-bias"
path = "src/main.rs"

[dependencies]
# One GPUI family, shared with the pinned Kit controls and Metal platform.
gpui-kit = "=0.6.6"
gpui = { package = "gpui-pre", version = "=0.3.6" }

# Terminal engine + shell (added for real in Phase 1; declared now so the tree resolves).
alacritty_terminal = "0.26"
portable-pty = "0.8"

# Gamepad input (PS2/PlayStation controllers). Uses IOKit's IOHIDManager on
# macOS; the `Gilrs` handle is !Send and pumps a CFRunLoop, so it must be
# created and polled on one dedicated thread (see `gamepad.rs`).
gilrs = "0.11"

anyhow = "1"
log = "0.4"
futures = "0.3"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
# Bundled SQLite (compiled from source via the C toolchain in CLT) — no ORM.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
# The controller map renders offscreen, independently of GPUI's renderer.
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0
