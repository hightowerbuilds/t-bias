[package]
name = "t-bias"
version = "0.1.0"
edition = "2021"
description = "t-bias — a native GPU-accelerated terminal (GPUI + alacritty_terminal)"

[[bin]]
name = "t-bias"
path = "src/main.rs"

[dependencies]
# Published GPUI from crates.io with the BLADE renderer (macos-blade), not the
# default Metal backend. Blade (wgpu/naga) renders glyphs correctly on this
# Intel/AMD Mac — the Metal backend (gpui_macos) renders only solid quads here,
# leaving all text invisible. Blade also compiles shaders via naga, so no Xcode /
# `xcrun metal` is needed. (Confirmed against a working setup: hightowerbuilds/llnzy.)
gpui = { version = "=0.2.2", features = ["macos-blade"] }

# Terminal engine + shell (added for real in Phase 1; declared now so the tree resolves).
alacritty_terminal = "0.26"
portable-pty = "0.8"

anyhow = "1"
log = "0.4"
futures = "0.3"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
# Bundled SQLite (compiled from source via the C toolchain in CLT) — no ORM.
rusqlite = { version = "0.32", features = ["bundled"] }
