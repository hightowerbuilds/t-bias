[package]
name = "tbias-pty"
version = "0.1.0"
edition = "2021"
description = "t-bias PTY sidecar — owns pseudo-terminals, bridges to Deno over stdio NDJSON"

[[bin]]
name = "tbias-pty"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8"
serde_json = "1.0"
base64 = "0.22"
libc = "0.2"

[profile.release]
strip = true
